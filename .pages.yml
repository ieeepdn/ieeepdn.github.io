        required: true
        default: competition
        options:
        - label: Flagship event / competition — header, about, tracks, timeline, prizes, FAQ, register
          value: competition
        - label: Conference — call for papers, dates, speakers, schedule, fees, venue, committee, FAQ
          value: conference
        - label: Project — header, story, impact numbers, photos
          value: project
        - label: Info page — header and text
          value: info
      - name: append
        label: Add after the existing sections
        type: checkbox
    - name: duplicate
      label: Duplicate
      scope: entry
      workflow: cms-actions.yml
      confirm:
        title: Duplicate this page?
        message: Saves a copy (as a draft where possible). After about a minute, refresh the list and open the copy.
        button: Duplicate
      fields:
      - name: title
        label: Title of the copy (leave empty for “… (copy)”)
        type: text
  - name: albums
    label: Photo albums
    description: Event photos for the Gallery page, chapter pages and the home page. Drop many photos at once into “Photos”, drag them to reorder; the cover (or the first photo) leads the album.
    type: collection
    path: content/albums
    format: json
    filename: '{primary}.json'
    view:
      primary: title
      fields:
      - title
      - date
      - chapter
      sort:
      - date
      default:
        sort: date
        order: desc
      search:
      - title
    fields:
    - name: id
      type: uuid
      label: Entry ID
      description: Created automatically — used when other entries link to this one.
      options:
        generate: false
      hidden: true
    - name: title
      label: Title
      required: true
      type: string
    - name: chapter
      label: Chapter
      description: Filled in with your chapter automatically. Only branch webmasters can change it.
      required: true
      type: reference
      options:
        collection: chapters
        value: '{fields.id}'
        label: '{fields.name}'
    - name: date
      label: Date
      type: date
      default: ''
      options:
        format: yyyy-MM-dd
    - name: photos
      label: Photos
      required: true
      type: image
      options:
        media: images
        multiple: true
        unique: true
      description: Drag several photos in at once. Drag to reorder. Photos are never cropped on the Gallery page.
    - name: cover
      label: Cover photo (optional)
      type: image
      options:
        media: images
      description: 'Leads the album and its card. Empty: the first photo.'
    - name: pinned
      label: Pin to the top of the Gallery
      type: boolean
    - name: notInMosaic
      label: Keep out of the home page and chapter photo mosaics
      type: boolean
      description: The album still shows on the Gallery page.
    - name: hidden
      label: Hide this album
      type: boolean
      description: Takes the album off the website without deleting the photos.
    - name: description
      label: Description
      type: text
    - name: slug
      label: Address
      description: Leave empty to use the title.
      type: string
    - name: updatedAt
      type: string
      hidden: true
- name: programmes-news
  label: Programmes, news & events
  type: group
  items:
  - name: programs
    label: Flagship programmes
    description: 'The branch’s flagship programmes (Pera Xtreme, Predicta, MentorSpark…): a card on the home page and a page at /programmes/<address>. For a full event page with schedules, speakers and registration, use a Chapter sub-page.'
    type: collection
    path: content/programs
    format: json
    filename: '{primary}.json'
    view:
      primary: title
      fields:
      - title
      - order
      sort:
      - order
      default:
        sort: order
        order: asc
      search:
      - title
    fields:
    - name: id
      type: uuid
      label: Entry ID
      description: Created automatically — used when other entries link to this one.
      options:
        generate: false
      hidden: true
    - name: name
      label: Programme name
      required: true
      type: string
    - name: edition
      label: Latest edition
      description: e.g. “Predicta 1.0”, “Pera.Xtreme-24”
      type: string
    - name: tagline
      label: Tagline
      required: true
      type: string
      description: One line, shown large on the card.
    - name: summary
      label: Summary
      required: true
      type: text
      description: A short paragraph for the home page card.
    - name: cover
      label: Card & header photo
      type: image
      options:
        media: images
    - name: logo
      label: Logo
      type: image
      options:
        media: images
    - name: accent
      label: Programme colour
      default: '#00629B'
      type: string
      pattern:
        regex: ^(#?([0-9a-fA-F]{3}|[0-9a-fA-F]{6}))?$
        message: 'Use a colour code like #00629B (or leave it empty)'
      description: 'A colour code, e.g. #00629B (IEEE blue).'
    - name: stats
      label: Big numbers
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{fields.label}'
      fields:
      - name: value
        label: Value
        required: true
        type: string
      - name: label
        label: Label
        required: true
        type: string
      description: Up to 3, e.g. “24h” / “global coding marathon”.
    - name: sections
      label: Page sections
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{fields.heading}'
      fields:
      - name: heading
        label: Heading
        required: true
        type: string
      - name: body
        label: Body
        required: true
        type: text
      - name: points
        label: Points
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{fields.text}'
        fields:
        - name: text
          label: Text
          required: true
          type: string
      description: 'The programme page: a heading, a paragraph and bullet points per section.'
    - name: links
      label: Buttons
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{fields.label}'
      fields:
      - name: label
        label: Label
        required: true
        type: string
      - name: url
        label: Link (URL)
        required: true
        type: string
      - name: primary
        label: Primary
        type: boolean
      description: Tick “Primary” for the main button (e.g. Register).
    - name: contacts
      label: Contact people
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{fields.name}'
      fields:
      - name: name
        label: Name
        required: true
        type: string
      - name: role
        label: Role
        type: string
      - name: email
        label: Email
        type: string
    - name: gallery
      label: Photos
      type: image
      options:
        media: images
        multiple: true
    - name: slug
      label: Page address
      description: Leave empty to use the name. The page lives at /programmes/<address>.
      type: string
    - name: order
      label: Position
      default: 10
      type: number
      description: Lower numbers come first.
    - name: updatedAt
      type: string
      hidden: true
  - name: posts
    label: News & stories
    description: Recaps and announcements.
    type: collection
    path: content/posts
    format: json
    filename: '{primary}.json'
    view:
      primary: title
      fields:
      - title
      - date
      - chapter
      - _status
      sort:
      - date
      default:
        sort: date
        order: desc
      search:
      - title
    fields:
    - name: id
      type: uuid
      label: Entry ID
      description: Created automatically — used when other entries link to this one.
      options:
        generate: false
      hidden: true
    - name: title
      label: Title
      required: true
      type: string
    - name: chapter
      label: Chapter
      description: Filled in with your chapter automatically. Only branch webmasters can change it.
      required: true
      type: reference
      options:
        collection: chapters
        value: '{fields.id}'
        label: '{fields.name}'
    - name: date
      label: Date
      required: true
      type: date
      default: ''
      options:
        format: yyyy-MM-dd
    - name: kind
      label: Type
      default: story
      type: select
      options:
        values:
        - name: recap
          label: Event recap
        - name: announcement
          label: Announcement
        - name: story
          label: Story
        - name: achievement
          label: Achievement
    - name: _status
      label: Status
      type: select
      default: published
      options:
        values:
        - name: published
          label: Published
        - name: draft
          label: Draft (hidden)
    - name: excerpt
      label: Short summary
      description: One or two sentences for the card.
      type: text
    - name: cover
      label: Cover photo
      type: image
      options:
        media: images
    - name: content
      label: Story
      type: rich-text
      options:
        format: html
        media: images
    - name: gallery
      label: Gallery
      description: Extra photos shown under the article.
      type: image
      options:
        media: images
        multiple: true
    - name: cta
      label: Call to action (optional)
      type: object
      fields:
      - name: label
        label: Label
        type: string
      - name: url
        label: Link (URL)
        type: string
    - name: featured
      label: Featured on home page
      description: Branch webmasters only.
      type: boolean
    - name: slug
      label: Page address
      description: Leave empty to use the title.
      type: string
    - name: updatedAt
      type: string
      hidden: true
    actions:
    - name: duplicate
      label: Duplicate
      scope: entry
      workflow: cms-actions.yml
      confirm:
        title: Duplicate this story?
        message: Saves a copy (as a draft where possible). After about a minute, refresh the list and open the copy.
        button: Duplicate
      fields:
      - name: title
        label: Title of the copy (leave empty for “… (copy)”)
        type: text
  - name: events
    label: Events
    description: Synced from IEEE vTools once a day (title, dates, venue come from vTools — edit them there). You can change the cover, photos, category, hide an event or feature it.
    type: collection
    path: content/events
    format: json
    filename: '{primary}.json'
    view:
      primary: title
      fields:
      - title
      - start
      - chapter
      - hidden
      sort:
      - start
      default:
        sort: start
        order: desc
      search:
      - title
    fields:
    - name: id
      type: uuid
      label: Entry ID
      description: Created automatically — used when other entries link to this one.
      options:
        generate: false
      hidden: true
    - name: title
      label: Title
      required: true
      type: string
    - name: chapter
      label: Chapter
      description: Filled in with your chapter automatically. Only branch webmasters can change it.
      required: true
      type: reference
      options:
        collection: chapters
        value: '{fields.id}'
        label: '{fields.name}'
    - name: start
      label: Start
      required: true
      type: date
      default: ''
      options:
        time: true
        format: yyyy-MM-dd'T'HH:mm
    - name: end
      label: End
      type: date
      default: ''
      options:
        time: true
        format: yyyy-MM-dd'T'HH:mm
    - name: category
      label: Category
      default: talk
      type: select
      options:
        values:
        - name: talk
          label: Talk / lecture
        - name: workshop
          label: Workshop
        - name: competition
          label: Competition
        - name: visit
          label: Field visit
        - name: social
          label: Social / outreach
        - name: meeting
          label: Meeting
    - name: hidden
      label: Hide from the website
      description: Takes the event off the site. Use this instead of deleting a vTools event.
      type: boolean
    - name: featured
      label: Featured on home page
      description: Branch webmasters only.
      type: boolean
    - name: cover
      label: Cover photo
      description: The poster or best photo. Filled in from vTools automatically when the event has images there.
      type: image
      options:
        media: images
    - name: gallery
      label: Photos
      description: Photos shown on the event page. vTools photos are copied here on the first sync.
      type: image
      options:
        media: images
        multiple: true
    - name: summary
      label: Summary
      type: text
    - name: venue
      label: Venue
      type: string
    - name: city
      label: City
      type: string
    - name: virtual
      label: Virtual
      type: boolean
    - name: registrationUrl
      label: Registration link
      type: string
    - name: vtoolsUrl
      label: vTools link
      type: string
    - name: vtoolsId
      label: vTools event number
      readonly: true
      type: string
    - name: hostName
      label: Host (from vTools)
      readonly: true
      type: string
    - name: slug
      label: Page address
      description: Leave empty to use the title.
      type: string
    - name: descriptionHtml
      label: Description (from vTools)
      hidden: true
      type: text
    - name: source
      label: Source
      readonly: true
      default: manual
      type: select
      options:
        values:
        - name: vtools
          label: IEEE vTools
        - name: manual
          label: Added manually
      hidden: true
    - name: syncedAt
      label: Synced At
      readonly: true
      type: date
      default: ''
      options:
        time: true
        format: yyyy-MM-dd'T'HH:mm
      hidden: true
    - name: vtoolsMediaDone
      label: Vtools Media Done
      hidden: true
      type: boolean
    - name: updatedAt
      type: string
      hidden: true
- name: forms-files
  label: Forms, files & images
  type: group
  items:
  - name: forms
    label: Forms
    description: Registration and feedback forms.
    type: collection
    path: content/forms
    format: json
    filename: '{primary}.json'
    view:
      primary: title
      fields:
      - title
      - chapter
      sort:
      - title
      default:
        sort: title
        order: asc
      search:
      - title
    fields:
    - name: id
      type: uuid
      label: Entry ID
      description: Created automatically — used when other entries link to this one.
      options:
        generate: false
      hidden: true
    - name: title
      label: Title
      required: true
      type: string
    - name: chapter
      label: Chapter
      description: Filled in with your chapter automatically. Only branch webmasters can change it.
      required: true
      type: reference
      options:
        collection: chapters
        value: '{fields.id}'
        label: '{fields.name}'
    - name: endpoint
      label: Where responses go (Formspree URL)
      type: string
      description: Create a free form at formspree.io with the chapter email and paste its address, e.g. https://formspree.io/f/abcdwxyz. Responses arrive by email and can be exported as CSV there.
    - name: externalUrl
      label: …or link to a Google Form
      type: string
      description: Leave the Formspree address empty and paste a Google Form link to send visitors there instead.
    - name: status
      label: Status
      default: open
      type: select
      options:
        values:
        - name: open
          label: Open
        - name: closed
          label: Closed
    - name: intro
      label: Intro
      description: Shown above the questions on the form’s own page.
      type: text
    - name: fields
      label: Questions
      type: block
      list:
        collapsible:
          collapsed: true
          summary: '{index}. {fields.heading}'
      blockKey: blockType
      blocks:
      - name: shortText
        label: Short answer
        component: block_shortText
      - name: email
        label: Email
        component: block_email
      - name: phone
        label: Phone number
        component: block_phone
      - name: number
        label: Number
        component: block_number
      - name: longText
        label: Paragraph
        component: block_longText
      - name: select
        label: Dropdown
        component: block_select
      - name: radio
        label: Multiple choice (one answer)
        component: block_radio
      - name: checkboxes
        label: Checkboxes (several answers)
        component: block_checkboxes
      - name: date
        label: Date
        component: block_date
      - name: url
        label: Link (URL)
        component: block_url
      - name: consent
        label: Agreement tick box
        component: block_consent
      - name: section
        label: Section heading
        component: block_section
    - name: submitLabel
      label: Submit button text
      default: Submit
      type: string
    - name: confirmationTitle
      label: Thank-you title
      default: Thank you!
      type: string
    - name: confirmationMessage
      label: Thank-you message
      default: Your response has been recorded.
      type: text
    - name: opensAt
      label: Opens at
      description: Optional
      type: date
      default: ''
      options:
        time: true
        format: yyyy-MM-dd'T'HH:mm
    - name: closesAt
      label: Closes at
      description: Optional — the form closes itself
      type: date
      default: ''
      options:
        time: true
        format: yyyy-MM-dd'T'HH:mm
    - name: slug
      label: Form address
      description: The form lives at /forms/<address>. Leave empty to use the title.
      type: string
    - name: maxResponses
      label: Maximum responses
      description: Optional cap, e.g. 60 seats
      type: number
      hidden: true
    - name: onePerEmail
      label: One response per email address
      description: Needs an Email question
      type: boolean
      hidden: true
    - name: updatedAt
      type: string
      hidden: true
    actions:
    - name: duplicate
      label: Duplicate
      scope: entry
      workflow: cms-actions.yml
      confirm:
        title: Duplicate this form?
        message: Saves a copy (as a draft where possible). After about a minute, refresh the list and open the copy.
        button: Duplicate
      fields:
      - name: title
        label: Title of the copy (leave empty for “… (copy)”)
        type: text
  - name: documents
    label: Files
    description: PDFs and other files for the Downloads section.
    type: collection
    path: content/documents
    format: json
    filename: '{primary}.json'
    view:
      primary: title
      fields:
      - title
      - chapter
      sort:
      - title
      default:
        sort: title
        order: asc
      search:
      - title
    fields:
    - name: id
      type: uuid
      label: Entry ID
      description: Created automatically — used when other entries link to this one.
      options:
        generate: false
      hidden: true
    - name: title
      label: Title
      required: true
      type: string
    - name: chapter
      label: Chapter
      type: reference
      options:
        collection: chapters
        value: '{fields.id}'
        label: '{fields.name}'
    - name: file
      type: file
      required: true
      options:
        media: files
      label: File
    - name: updatedAt
      type: string
      hidden: true
  - name: media-info
    label: Image descriptions
    description: Alt text (what the image shows), photo credit and focal point for images. Add a row when you upload an important image.
    type: file
    path: content/media.json
    format: json
    list: true
    fields:
    - name: file
      type: image
      required: true
      options:
        media: images
    - name: alt
      type: string
      label: Alt text
      description: What the image shows. For a poster, type the text on it.
    - name: credit
      type: string
    - name: focalX
      type: number
      label: Focal point X (%)
      description: 0 = left, 100 = right. Default 50.
    - name: focalY
      type: number
      label: Focal point Y (%)
      description: 0 = top, 100 = bottom. Default 50.
