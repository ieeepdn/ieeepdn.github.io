content:
- name: website
  label: Website
  type: group
  items:
  - name: home
    label: Home page
    type: file
    path: content/home.json
    format: json
    description: 'The home page: big header, announcement bar, which sections show and in what order, and their texts.'
    fields:
    - name: hero
      label: Big header (hero)
      type: object
      fields:
      - name: kicker
        label: Small label above the title
        type: string
      - name: title
        label: Title
        type: string
      - name: accent
        label: Second line (in colour)
        type: string
      - name: text
        label: Intro text
        type: text
      - name: background
        label: Background
        type: select
        default: Animated signal field
        description: “Plain gradient” is the lightest for phones. “Photo” uses the photo below.
        options:
          values:
          - Animated signal field
          - Photo
          - Plain gradient
      - name: image
        label: Background photo
        type: image
        options:
          media: images
        description: Used when the background is “Photo”. At least 1920 px wide; it is darkened so the text stays readable.
    - name: announcement
      label: Announcement bar
      type: object
      fields:
      - name: active
        label: Active
        type: boolean
      - name: text
        label: Text
        type: string
      - name: url
        label: Link (URL)
        type: string
      description: The coloured strip at the top of every page.
    - name: sections
      label: Home page sections
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{fields.section}'
      description: The home page below the header, top to bottom. Drag ⋮⋮ to reorder, untick “Show” to hide a section. Leave the texts empty to keep the built-in wording.
      fields:
      - name: section
        label: Section
        type: select
        required: true
        options:
          values:
          - Chapter ticker
          - Spotlight banner
          - Why we exist
          - Chapters
          - Flagship programmes
          - Events
          - History timeline
          - News & stories
          - Photo moments
          - Video
          - Call to action
      - name: show
        label: Show on the home page
        type: boolean
        default: true
      - name: eyebrow
        label: Small label above the heading
        type: string
      - name: heading
        label: Heading
        type: string
      - name: text
        label: Intro text
        type: text
        description: 'Not used by: Chapter ticker, Spotlight banner, Why we exist, Photo moments.'
    - name: statement
      label: “Why we exist” statement
      type: text
      description: The big sentence that lights up as visitors scroll.
    - name: stats
      label: Big numbers (“Why we exist”)
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{fields.value}{fields.suffix} — {fields.label}'
      fields:
      - name: value
        label: Value
        required: true
        type: string
      - name: suffix
        label: Suffix
        type: string
      - name: label
        label: Label
        required: true
        type: string
    - name: vision
      label: Our vision
      type: text
    - name: mission
      label: Our mission
      type: text
    - name: timeline
      label: History timeline
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{fields.year} — {fields.title}'
      description: Milestones on the home page and the About page, oldest first.
      fields:
      - name: year
        label: Year
        type: string
        required: true
      - name: title
        label: Title
        type: string
        required: true
      - name: body
        label: Text
        type: text
    - name: showreel
      label: YouTube video for the Video section
      type: string
      description: The video ID — the part after “watch?v=” in the YouTube link. Leave empty to hide the Video section.
    - name: cta
      label: Call to action band
      type: object
      fields:
      - name: title
        label: Heading
        type: string
      - name: text
        label: Text
        type: text
  - name: spotlight
    label: Spotlight (big event)
    type: file
    path: content/spotlight.json
    format: json
    description: Promote one big event (a conference, a flagship) on the home page, in the menu and the top bar, between two dates.
    fields:
    - name: active
      label: Show the spotlight
      type: boolean
    - name: style
      label: Style
      description: “Take over” replaces the big home-page header while the spotlight is on.
      default: banner
      type: select
      options:
        values:
        - name: banner
          label: Banner under the hero
        - name: hero
          label: Take over the hero
    - name: showFrom
      label: Show from
      description: Optional — starts showing at this time
      type: date
      default: ''
      options:
        time: true
        format: yyyy-MM-dd'T'HH:mm
    - name: showUntil
      label: Show until
      description: Optional — hides itself after this, e.g. the last conference day
      type: date
      default: ''
      options:
        time: true
        format: yyyy-MM-dd'T'HH:mm
    - name: linkType
      label: Links to
      default: page
      type: select
      options:
        values:
        - name: page
          label: A page on this site
        - name: url
          label: Another website
    - name: page
      label: Page
      description: It must be published. Its title, card text, cover and colour fill anything left empty below.
      type: reference
      options:
        collection: pages
        value: '{fields.id}'
        label: '{fields.title}'
    - name: url
      label: Link (URL)
      type: string
    - name: eyebrow
      label: Small label above the heading
      description: Small label above the title
      type: string
    - name: title
      label: Title
      description: Leave empty to use the linked page’s title.
      type: string
    - name: text
      label: Text
      description: 'One or two sentences. Empty: the page’s card text.'
      type: text
    - name: dateLabel
      label: Date (as shown)
      type: string
    - name: venue
      label: Venue
      type: string
    - name: countdownTo
      label: Count down to
      description: Optional live countdown, e.g. to the paper deadline
      type: date
      default: ''
      options:
        time: true
        format: yyyy-MM-dd'T'HH:mm
    - name: countdownLabel
      label: Countdown label
      description: Words above the countdown
      type: string
    - name: image
      label: Image
      description: A wide photo (≥ 1920 px) or the poster — posters are never cropped
      type: image
      options:
        media: images
    - name: logo
      label: Logo
      description: Optional event logo (transparent PNG)
      type: image
      options:
        media: images
    - name: accent
      label: Colour (optional)
      description: Defaults to the linked page’s colour, else IEEE blue.
      type: string
      pattern:
        regex: ^(#?([0-9a-fA-F]{3}|[0-9a-fA-F]{6}))?$
        message: 'Use a colour code like #00629B (or leave it empty)'
    - name: buttons
      label: Buttons
      description: Up to 3. With none, a single “Learn more” button opens the link above.
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{fields.label}'
      fields:
      - name: label
        label: Label
        required: true
        type: string
      - name: url
        label: Link (URL)
        description: https://… or /chapters/…
        required: true
        type: string
      - name: variant
        label: Variant
        default: primary
        type: select
        options:
          values:
          - name: primary
            label: Solid
          - name: secondary
            label: Outline
    - name: inTopBar
      label: Also show in the top bar
      description: When the announcement bar is off
      type: boolean
    - name: topBarText
      label: Top bar text
      type: string
    - name: inMenu
      label: Add to the main menu
      type: boolean
    - name: menuLabel
      label: Menu label
      type: string
  - name: theme
    label: Theme & colours
    type: file
    path: content/theme.json
    format: json
    description: Colours, fonts and header style for the whole site. Changes go live with the next publish (2–3 minutes).
    fields:
    - name: colours
      label: Brand colours
      type: object
      description: 'Colour codes like #00629B. Clear a box to go back to the original colour.'
      fields:
      - name: primary
        label: Main colour
        type: string
        pattern:
          regex: ^(#?([0-9a-fA-F]{3}|[0-9a-fA-F]{6}))?$
          message: 'Use a colour code like #00629B (or leave it empty)'
        default: '#00629B'
        description: 'Buttons, links and the call-to-action band. IEEE blue: #00629B.'
      - name: accent
        label: Bright accent
        type: string
        pattern:
          regex: ^(#?([0-9a-fA-F]{3}|[0-9a-fA-F]{6}))?$
          message: 'Use a colour code like #00629B (or leave it empty)'
        default: '#43C6F4'
        description: 'Highlights on dark backgrounds and links in dark mode. Original: #43C6F4.'
      - name: highlight
        label: Warm highlight
        type: string
        pattern:
          regex: ^(#?([0-9a-fA-F]{3}|[0-9a-fA-F]{6}))?$
          message: 'Use a colour code like #00629B (or leave it empty)'
        default: '#FFB547'
        description: 'The announcement bar and badges. Original: #FFB547.'
      - name: dark
        label: Dark background
        type: string
        pattern:
          regex: ^(#?([0-9a-fA-F]{3}|[0-9a-fA-F]{6}))?$
          message: 'Use a colour code like #00629B (or leave it empty)'
        default: '#030A13'
        description: 'Headers, footer and dark sections. Keep it very dark so white text stays readable. Original: #030A13.'
    - name: fonts
      label: Fonts
      type: object
      fields:
      - name: display
        label: Headings
        type: select
        default: Bricolage Grotesque
        options:
          values:
          - Bricolage Grotesque
          - Space Grotesk
          - Outfit
          - Plus Jakarta Sans
          - Fraunces (serif)
      - name: body
        label: Body text
        type: select
        default: IBM Plex Sans
        options:
          values:
          - IBM Plex Sans
          - DM Sans
          - Source Sans 3
          - Plus Jakarta Sans
    - name: heroes
      label: Page headers
      type: object
      description: The dark header at the top of every page except the home page (its header is set in Home page → Big header).
      fields:
      - name: pageHero
        label: Style
        type: select
        default: Photo with colour glow
        options:
          values:
          - Photo with colour glow
          - Brighter photo
          - Solid colour
        description: “Solid colour” uses the chapter’s colour (or the main colour) instead of a photo.
    - name: defaultMode
      label: Light or dark for first-time visitors
      type: select
      default: Follow the visitor’s device
      options:
        values:
        - Follow the visitor’s device
        - Light
        - Dark
      description: Visitors can still switch with the sun/moon button; their choice is remembered.
  - name: settings
    label: Contact, links & vTools
    type: file
    path: content/settings.json
    format: json
    description: Branch email and address, social links, the volunteer form, analytics and the IEEE vTools sync.
    fields:
    - name: email
      label: Email
      default: ieeepdn@gmail.com
      type: string
    - name: address
      label: Address
      default: 'Department of Electrical & Electronic Engineering

        Faculty of Engineering, University of Peradeniya

        Peradeniya 20400, Sri Lanka'
      type: text
    - name: facebook
      label: Facebook
      type: string
    - name: instagram
      label: Instagram
      type: string
    - name: linkedin
      label: LinkedIn
      type: string
    - name: youtube
      label: YouTube
      default: https://www.youtube.com/@ieeeperadeniya8445
      type: string
    - name: volunteerForm
      label: Volunteer application form URL
      type: string
    - name: googleAnalyticsId
      label: Google Analytics 4 measurement ID (optional)
      description: Optional, e.g. G-ABC123XYZ. Leave empty for no analytics.
      type: string
    - name: vtoolsEnabled
      label: Sync events from IEEE vTools
      default: true
      type: boolean
    - name: vtoolsBranchSpoid
      label: Student Branch organisational unit ID (SPOID)
      description: Chapter SPOIDs are set on each chapter.
      type: string
    - name: vtoolsHostMatch
      label: Branch host-name match (backup rule)
      description: 'Backup rule: co-hosted events whose host name contains this text count as ours. vTools spells some units "Peradeniy", so keep it short.'
      default: Peradeniya
      type: string
- name: chapters-group
  label: Chapters
  type: group
  items:
  - name: chapters
    label: Chapter pages
    description: One entry per chapter page (and the Student Branch). The details at the top fill the page header and the “About” section; “Page sections” is the rest of the page, top to bottom.
    type: collection
    path: content/chapters
    format: json
    filename: '{primary}.json'
    view:
      primary: name
      fields:
      - name
      - shortName
      sort:
      - order
      default:
        sort: order
        order: asc
      search:
      - name
    fields:
    - name: id
      type: uuid
      label: Entry ID
      description: Created automatically — used when other entries link to this one.
      options:
        generate: false
      hidden: true
    - name: name
      label: Chapter name
      required: true
      type: string
    - name: shortName
      label: Short name
      description: e.g. CS, ComSoc, WIE
      required: true
      type: string
    - name: tagline
      label: Tagline
      type: string
      description: One line under the chapter name in the page header.
    - name: cover
      label: Header photo
      type: image
      options:
        media: images
      description: Wide photo behind the page header (at least 1920 px wide).
    - name: logo
      label: Logo
      type: image
      options:
        media: images
      description: Square logo on a white background works best.
    - name: accent
      label: Chapter colour
      description: Chapter colour (hex)
      default: '#00629B'
      type: string
      pattern:
        regex: ^(#?([0-9a-fA-F]{3}|[0-9a-fA-F]{6}))?$
        message: 'Use a colour code like #00629B (or leave it empty)'
    - name: about
      label: About
      description: Two or three short paragraphs — shown in the “About” section.
      type: text
    - name: mission
      label: Mission
      type: text
    - name: highlights
      label: Big numbers
      description: Short facts shown large, e.g. “1st” / “MTT-S chapter in Sri Lanka”.
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{fields.label}'
      fields:
      - name: value
        label: Value
        required: true
        type: string
      - name: label
        label: Label
        required: true
        type: string
    - name: links
      label: Links
      type: object
      fields:
      - name: email
        label: Email
        type: string
      - name: website
        label: Website
        type: string
      - name: facebook
        label: Facebook
        type: string
      - name: instagram
        label: Instagram
        type: string
      - name: linkedin
        label: LinkedIn
        type: string
      - name: join
        label: Join / society membership URL
        type: string
    - name: layout
      label: Page sections
      type: block
      list:
        collapsible:
          collapsed: true
          summary: '{index}. {fields.heading}'
      blockKey: blockType
      blocks:
      - name: chapterAbout
        label: About the chapter (automatic)
        component: block_chapterAbout
      - name: text
        label: Text
        component: block_text
      - name: mediaText
        label: Image + text
        component: block_mediaText
      - name: cards
        label: Cards
        component: block_cards
      - name: stats
        label: Big numbers
        component: block_stats
      - name: timeline
        label: Timeline / schedule
        component: block_timeline
      - name: gallery
        label: Photos
        component: block_gallery
      - name: events
        label: Events (automatic)
        component: block_events
      - name: stories
        label: News (automatic)
        component: block_stories
      - name: people
        label: People
        component: block_people
      - name: faq
        label: Questions & answers
        component: block_faq
      - name: form
        label: Form
        component: block_form
      - name: downloads
        label: Downloads
        component: block_downloads
      - name: logos
        label: Sponsors & partners
        component: block_logos
      - name: video
        label: YouTube video
        component: block_video
      - name: pageLinks
        label: Sub-page cards
        component: block_pageLinks
      - name: schedule
        label: Programme schedule
        component: block_schedule
      - name: speakers
        label: Speakers
        component: block_speakers
      - name: fees
        label: Registration fees
        component: block_fees
      - name: venue
        label: Venue & travel
        component: block_venue
      - name: cta
        label: Call to action
        component: block_cta
      description: The chapter page, top to bottom. “+ Add” adds a section, drag ⋮⋮ to reorder, click a section to open it. “Hide this section” takes it off the page without deleting it. Headings left empty use the built-in wording.
    - name: vtools
      label: IEEE vTools
      type: object
      fields:
      - name: spoid
        label: Organisational unit ID (SPOID)
        description: Find it in vTools → Events → your chapter. Events hosted or co-hosted by this unit appear on the site automatically.
        type: string
      - name: hostNameMatch
        label: Host-name keywords (backup rule)
        description: 'Fallback when the SPOID is empty: events whose host name contains this text are matched (e.g. "Peradeniya").'
        type: string
    - name: slug
      label: Page address
      description: The page lives at /chapters/<address>. Changing it breaks old links.
      type: string
    - name: kind
      label: Type
      required: true
      default: chapter
      type: select
      options:
        values:
        - name: branch
          label: Student Branch
        - name: chapter
          label: Society chapter
        - name: affinity
          label: Affinity group
      description: Branch webmaster only.
    - name: founded
      label: Founded (year)
      type: number
    - name: order
      label: Position in lists
      default: 10
      type: number
      description: Lower numbers come first.
    - name: updatedAt
      type: string
      hidden: true
  - name: committees
    label: Committees
    description: 'One entry per chapter per term. To start a new year, open last year’s committee and press “Duplicate for a new term” (top right): you get a copy with all the people, hidden until you finish editing it. Last year’s committee stays online as history.'
    type: collection
    path: content/committees
    format: json
    filename: '{fields.term}-{primary}.json'
    view:
      primary: title
      fields:
      - title
      - current
      sort:
      - term
      default:
        sort: term
        order: desc
      search:
      - title
      - term
    fields:
    - name: id
      type: uuid
      label: Entry ID
      description: Created automatically — used when other entries link to this one.
      options:
        generate: false
      hidden: true
    - name: term
      label: Term
      description: e.g. 2026/27
      required: true
      default: 2025/26
      type: string
    - name: chapter
      label: Chapter
      description: Filled in with your chapter automatically. Only branch webmasters can change it.
      required: true
      type: reference
      options:
        collection: chapters
        value: '{fields.id}'
        label: '{fields.name}'
    - name: current
      label: Shown on the chapter page
      description: When several committees of a chapter are ticked, the newest term is shown on the chapter page.
      default: true
      type: boolean
    - name: hidden
      label: Hide from the website (work in progress)
      type: boolean
      description: A copy made with “Duplicate for a new term” starts hidden. Untick this when the new committee is ready — it then replaces the old one on the chapter page.
    - name: title
      label: Title
      hidden: true
      type: string
      description: e.g. “ComSoc · 2026/27”
    - name: executive
      label: Office bearers
      description: Order = order on the page. The row whose position is exactly “Chair” (or Chairman / Chairperson / President) gets the spotlight card.
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{fields.name} — {fields.position}'
      fields:
      - name: position
        label: Position
        required: true
        type: string
      - name: name
        label: Name
        required: true
        type: string
      - name: photo
        label: Photo
        description: Head-and-shoulders portrait. Shown 4:5 with the face in the top third.
        type: image
        options:
          media: images
      - name: linkedin
        label: LinkedIn URL
        type: string
      - name: email
        label: Email
        description: Not shown publicly.
        type: string
    - name: teams
      label: Teams
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{fields.name}'
      fields:
      - name: name
        label: Name
        required: true
        type: string
      - name: members
        label: Members
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{fields.name} — {fields.position}'
        fields:
        - name: name
          label: Name
          required: true
          type: string
        - name: role
          label: Role
          default: member
          type: select
          options:
            values:
            - name: lead
              label: Team lead
            - name: member
              label: Member
        - name: position
          label: Position
          type: string
        - name: photo
          label: Photo
          description: Head-and-shoulders portrait. Shown 4:5 with the face in the top third.
          type: image
          options:
            media: images
    - name: advisors
      label: Advisors & counsellors
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{fields.name} — {fields.position}'
      fields:
      - name: name
        label: Name
        required: true
        type: string
      - name: position
        label: Position
        default: Advisor
        type: string
      - name: photo
        label: Photo
        description: Head-and-shoulders portrait. Shown 4:5 with the face in the top third.
        type: image
        options:
          media: images
      - name: linkedin
        label: LinkedIn URL
        type: string
    - name: updatedAt
      type: string
      hidden: true
    actions:
    - name: committee-new-term
      label: Duplicate for a new term
      scope: entry
      workflow: cms-actions.yml
      confirm:
        title: Duplicate this committee?
        message: Saves a copy of this committee — with all its people — for another term. This committee is not changed and stays online as history. After about a minute, refresh Committees and open the copy to change the people.
        button: Duplicate
      fields:
      - name: term
        label: New term (leave empty for the next year, e.g. 2026/27 → 2027/28)
        type: text
      - name: publish
        label: Show the copy on the chapter page straight away (otherwise it stays hidden until you untick “Hide”)
        type: checkbox
