            component: block_consent
          - name: section
            label: Section heading
            component: block_section
      - name: submitLabel
        label: Submit Label
        default: Submit
        type: string
      - name: confirmationTitle
        label: Confirmation Title
        default: Thank you!
        type: string
      - name: confirmationMessage
        label: Confirmation Message
        default: Your response has been recorded.
        type: text
      - name: opensAt
        label: Opens At
        description: Optional
        type: date
        default: ""
        options:
          time: true
          format: yyyy-MM-dd'T'HH:mm
      - name: closesAt
        label: Closes At
        description: Optional — the form closes itself
        type: date
        default: ""
        options:
          time: true
          format: yyyy-MM-dd'T'HH:mm
      - name: maxResponses
        label: Max Responses
        description: Optional cap, e.g. 60 seats
        type: number
      - name: onePerEmail
        label: One response per email address
        description: Needs an Email question
        type: boolean
      - name: status
        label: Status
        default: open
        type: select
        options:
          values:
            - name: open
              label: Open
            - name: closed
              label: Closed
      - name: slug
        label: Slug
        description: Used in the page URL. Leave blank to generate it from the title.
        type: string
      - name: chapter
        label: Chapter
        description: Filled in with your chapter automatically. Only branch webmasters
          can change it.
        required: true
        type: reference
        options:
          collection: chapters
          value: "{fields.id}"
          label: "{fields.name}"
      - name: endpoint
        label: Where responses go (Formspree URL)
        type: string
        description: Create a free form at formspree.io with the chapter email and paste
          its address, e.g. https://formspree.io/f/abcdwxyz. Responses arrive by
          email and can be exported as CSV there.
      - name: externalUrl
        label: …or link to a Google Form
        type: string
        description: Leave the Formspree address empty and paste a Google Form link to
          send visitors there instead.
      - name: updatedAt
        type: string
        hidden: true
  - name: documents
    label: Files
    description: PDFs and other files for the Downloads section.
    type: collection
    path: content/documents
    format: json
    filename: "{primary}.json"
    view:
      primary: title
      fields:
        - title
        - chapter
      sort:
        - title
      default:
        sort: title
        order: asc
      search:
        - title
    fields:
      - *a1
      - name: title
        label: Title
        required: true
        type: string
      - name: chapter
        label: Chapter
        type: reference
        options:
          collection: chapters
          value: "{fields.id}"
          label: "{fields.name}"
      - name: file
        type: file
        required: true
        options:
          media: files
      - name: updatedAt
        type: string
        hidden: true
  - name: media-info
    label: Image descriptions
    description: Alt text (what the image shows), photo credit and focal point for
      images. Add a row when you upload an important image.
    type: file
    path: content/media.json
    format: json
    list: true
    fields:
      - name: file
        type: image
        required: true
        options:
          media: images
      - name: alt
        type: string
        label: Alt text
        description: What the image shows. For a poster, type the text on it.
      - name: credit
        type: string
      - name: focalX
        type: number
        label: Focal point X (%)
        description: 0 = left, 100 = right. Default 50.
      - name: focalY
        type: number
        label: Focal point Y (%)
        description: 0 = top, 100 = bottom. Default 50.
