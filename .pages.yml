content:
  - name: settings
    label: Site settings
    description: Home page, spotlight, announcement bar, contact details and vTools.
    type: file
    path: content/settings.json
    format: json
    fields:
      - name: spotlight
        type: object
        fields:
          - name: active
            label: Show the spotlight
            type: boolean
          - name: style
            label: Style
            description: “Take over” replaces the big home-page header while the spotlight
              is on.
            default: banner
            type: select
            options:
              values:
                - name: banner
                  label: Banner under the hero
                - name: hero
                  label: Take over the hero
          - name: showFrom
            label: Show From
            description: Optional — starts showing at this time
            type: date
            default: ""
            options:
              time: true
              format: yyyy-MM-dd'T'HH:mm
          - name: showUntil
            label: Show Until
            description: Optional — hides itself after this, e.g. the last conference day
            type: date
            default: ""
            options:
              time: true
              format: yyyy-MM-dd'T'HH:mm
          - name: linkType
            label: Links to
            default: page
            type: select
            options:
              values:
                - name: page
                  label: A page on this site
                - name: url
                  label: Another website
          - name: page
            label: Page
            description: It must be published. Its title, card text, cover and colour fill
              anything left empty below.
            type: reference
            options:
              collection: pages
              value: "{fields.id}"
              label: "{fields.title}"
          - name: url
            label: Url
            type: string
          - name: eyebrow
            label: Eyebrow
            description: Small label above the title
            type: string
          - name: title
            label: Title
            description: Leave empty to use the linked page’s title.
            type: string
          - name: text
            label: Text
            description: "One or two sentences. Empty: the page’s card text."
            type: text
          - name: dateLabel
            label: Date Label
            type: string
          - name: venue
            label: Venue
            type: string
          - name: countdownTo
            label: Countdown To
            description: Optional live countdown, e.g. to the paper deadline
            type: date
            default: ""
            options:
              time: true
              format: yyyy-MM-dd'T'HH:mm
          - name: countdownLabel
            label: Countdown Label
            description: Words above the countdown
            type: string
          - name: image
            label: Image
            description: A wide photo (≥ 1920 px) or the poster — posters are never cropped
            type: image
            options:
              media: images
          - name: logo
            label: Logo
            description: Optional event logo (transparent PNG)
            type: image
            options:
              media: images
          - name: accent
            label: Colour (optional)
            description: Defaults to the linked page’s colour, else IEEE blue.
            type: string
          - name: buttons
            label: Buttons
            description: Up to 3. With none, a single “Learn more” button opens the link
              above.
            type: object
            list: true
            fields:
              - name: label
                label: Label
                required: true
                type: string
              - name: url
                label: Url
                description: https://… or /chapters/…
                required: true
                type: string
              - name: variant
                label: Variant
                default: primary
                type: select
                options:
                  values:
                    - name: primary
                      label: Solid
                    - name: secondary
                      label: Outline
          - name: inTopBar
            label: Also show in the top bar
            description: When the announcement bar is off
            type: boolean
          - name: topBarText
            label: Top Bar Text
            type: string
          - name: inMenu
            label: Add to the main menu
            type: boolean
          - name: menuLabel
            label: Menu Label
            type: string
      - name: heroKicker
        label: Hero Kicker
        default: Est. 19 July 2001 · Faculty of Engineering
        type: string
      - name: heroTitle
        label: Hero Title
        default: Sri Lanka’s first IEEE Student Branch.
        type: string
      - name: heroAccent
        label: Hero Accent
        default: Still building the future.
        type: string
      - name: heroText
        label: Hero Text
        default: Inspiring future engineers to achieve, and leading our community to
          greater heights — through the strength of the worldwide IEEE network.
        type: text
      - name: announcement
        label: Announcement
        type: object
        fields:
          - name: active
            label: Active
            type: boolean
          - name: text
            label: Text
            type: string
          - name: url
            label: Url
            type: string
      - name: stats
        label: Stats
        type: object
        list: true
        fields:
          - name: value
            label: Value
            required: true
            type: string
          - name: suffix
            label: Suffix
            type: string
          - name: label
            label: Label
            required: true
            type: string
      - name: vision
        label: Vision
        type: text
      - name: mission
        label: Mission
        type: text
      - name: showreel
        label: YouTube video ID for the showreel
        type: string
      - name: email
        label: Email
        default: ieeepdn@gmail.com
