# Pages CMS configuration — https://pagescms.org/docs/configuration/
# The editor for the website. Sidebar groups: Website · Chapters · Programmes, news & events · Forms, files & images.
media:
- name: images
  label: Images
  input: public/media
  output: /media
  categories:
  - image
  rename: safe
- name: files
  label: Files
  input: public/files
  output: /files
  categories:
  - document
  - compressed
  - spreadsheet
  rename: safe
components:
  block_chapterAbout:
    type: object
    label: About the chapter (automatic)
    fields:
    - name: hidden
      label: Hide this section
      description: Takes it off the page but keeps everything here, ready to switch back on. The On/Off switch on the collapsed row does the same.
      type: boolean
    - name: heading
      label: Heading
      description: Defaults to “What is <chapter>?”. Text comes from the About, Mission, Highlights and Links fields.
      type: string
    - name: background
      label: Background
      default: auto
      type: select
      options:
        values:
        - name: auto
          label: Automatic (alternates)
        - name: paper
          label: Light
        - name: mist
          label: Tinted
        - name: dark
          label: Dark
        - name: accent
          label: Chapter colour
    - name: spacing
      label: Spacing
      default: normal
      type: select
      options:
        values:
        - name: normal
          label: Normal
        - name: compact
          label: Compact
    - name: anchor
      label: Link name (#anchor)
      description: Optional link name, e.g. “rules” → /page#rules
      type: string
    - name: blockName
      label: Note for editors
      type: string
  block_text:
    type: object
    label: Text
    fields:
    - name: hidden
      label: Hide this section
      description: Takes it off the page but keeps everything here, ready to switch back on. The On/Off switch on the collapsed row does the same.
