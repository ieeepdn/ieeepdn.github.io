# Builds the site and publishes it to GitHub Pages.
#  - on every push to main (a Pages CMS save is a push)
#  - once a day (05:47 Sri Lanka time): syncs events from IEEE vTools, commits any changes and republishes, so
#    "upcoming" events move to "past" and timed spotlights/forms open and close
#  - by hand: Actions → "Build & deploy" → Run workflow (tick "full history" to re-import every vTools event)
name: Build & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 0 * * *' # 00:17 UTC = 05:47 in Sri Lanka (off the hour, when GitHub is less busy)
  workflow_dispatch:
    inputs:
      full_history:
        description: Re-import the full vTools history
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: "page updated …" dates come from Git

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Sync events from IEEE vTools
        id: sync
        continue-on-error: true # vTools being down must never stop the site from publishing
        env:
          VTOOLS_MODE: ${{ inputs.full_history && 'full' || '' }}
        run: node scripts/vtools-sync.mjs

      - name: Commit synced events
        id: commit
        run: |
          git config user.name "vtools-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # vtools-state.json changes on every run (time of last sync) — only commit when events or photos changed
          if [ -n "$(git status --porcelain -- content public ':!content/vtools-state.json')" ]; then
            git add content public
            git commit -m "vTools sync: $(node -p "require('./content/vtools-state.json').lastResult.slice(0, 120)")"
            git pull --rebase --autostash origin main && git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide whether to publish
        id: decide
        # every run publishes: pushes, the daily sync (dates move on even when vTools has nothing new) and manual runs
        run: echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Cache resized images
        if: steps.decide.outputs.deploy == 'true'
        uses: actions/cache@v4
        with:
          path: |
            public/media/_sizes
            src/content/media-index.json
          key: media-${{ hashFiles('public/media/**', '!public/media/_sizes/**') }}
          restore-keys: media-

      - name: Install
        if: steps.decide.outputs.deploy == 'true'
        run: npm ci --no-audit --no-fund

      - name: Configure GitHub Pages
        if: steps.decide.outputs.deploy == 'true'
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        if: steps.decide.outputs.deploy == 'true'
        env:
          # the public address, e.g. https://ieee.soc.pdn.ac.lk (set it in Settings → Secrets and variables → Actions → Variables)
          NEXT_PUBLIC_SERVER_URL: ${{ vars.SITE_URL || steps.pages.outputs.origin }}
          # "/<repo>" while the site lives at https://<org>.github.io/<repo>/ — empty once a custom domain is set
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          npm run build
          touch out/.nojekyll
          # keep the custom domain set in Settings → Pages
          if [ -f CNAME ]; then cp CNAME out/CNAME; fi

      - name: Upload site
        if: steps.decide.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
